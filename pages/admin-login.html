<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Inner Circle</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <p class="section-label">
                INNER CIRCLE
            </p>

            <h1>
                Admin Login
            </h1>

            <p class="admin-login-subtitle">
                Authorized personnel only.
            </p>


            <form
                id="adminLoginForm"
                class="admin-login-form"
            >

                <label for="adminUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="adminUsername"
                    placeholder="Admin username"
                    required
                >


                <label for="adminPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Admin password"
                    required
                >


                <button type="submit">
                    Sign In
                </button>

            </form>


            <p
                id="adminLoginMessage"
                class="admin-login-message"
            ></p>

        </div>

    </main>


    <script src="../script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Membership Checkout | Inner Circle</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >
</head>

<body>

    <main class="checkout-page">

        <section class="checkout-card">

            <p class="section-label">
                INNER CIRCLE
            </p>

            <h1>Membership Checkout</h1>

            <p>
                Review your selected membership before
                continuing to payment.
            </p>

            <div class="checkout-membership">

                <span>Selected Membership</span>

                <h2 id="checkoutMembership">
                    Loyalty Seal
                </h2>

            </div>

            <p class="checkout-note">
                Payment processing will be provided through
                an authorized payment provider.
            </p>

            <button id="continuePayment">
                Continue to Payment
            </button>

            <button
                type="button"
                onclick="window.location.href='../index.html'"
            >
                Back
            </button>

        </section>

    </main>

    <script src="../script.js"></script>

</body>

</html>

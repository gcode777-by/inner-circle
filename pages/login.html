<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inner Circle | Login</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            <img src="../images/logo.png.jpeg" alt="Inner Circle">
        </div>

        <nav>
            <a href="../index.html">Home</a>
            <a href="../index.html#membership">Membership</a>
            <a href="../index.html#benefits">Benefits</a>
            <a href="register.html">Join</a>
        </nav>

    </header>


    <main class="login-page">

        <div class="login-container">

            <p class="section-label">MEMBER ACCESS</p>

            <h1>Welcome Back</h1>

            <p class="login-intro">
                Sign in to access your Inner Circle dashboard.
            </p>


            <form class="login-form">

                <label>Email Address</label>

                <input
                    type="email"
                    placeholder="Email Address"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    placeholder="Password"
                    required
                >


                <button type="submit">
                    Sign In
                </button>

            </form>


            <p class="register-link">
                Don't have an account?
                <a href="register.html">
                    Join the Inner Circle
                </a>
            </p>

        </div>

    </main>


    <script src="../script.js"></script>

</body>

</html>
